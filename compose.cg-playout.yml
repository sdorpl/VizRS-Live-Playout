# VizRS Live wpięty w stos VizRS CG Playout (jeden projekt compose: vizrs, cg, ersatztv, ingest + live, proxy).
# Nakładka na docker-compose.yml CG Playout – uruchamiana z katalogu CG Playout (RUNBOOK §2a):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.nvidia.yml:../VizRS Live/compose.cg-playout.yml
# W .env CG Playout: VIZRS_LIVE_DIR (ścieżka tego repozytorium), VIZRS_BRIDGE_TOKEN, VIZRS_LIVE_TOKEN;
# token CG dla panelu = VIZRS_PANEL_TOKEN CG Playout.
# Obrazy budowane z tego repozytorium (docker compose build w VizRS Live) albo z ghcr – LIVE_IMAGE, LIVE_LEGACY_IMAGE.
services:
  ersatztv:
    # oficjalne legacy + VizRS Bridge (wersja przypięta, nie :latest)
    image: ${LIVE_LEGACY_IMAGE:-ghcr.io/sdorpl/vizrs-live-legacy:1.0.0-legacy26.12.0}
    environment:
      VIZRS_BRIDGE_TOKEN: ${VIZRS_BRIDGE_TOKEN:?ustaw VIZRS_BRIDGE_TOKEN w .env}
    # web GUI legacy i most tylko w sieci wewnętrznej; widzowie – przez proxy
    ports: !reset []
    expose: ["8409"]

  proxy:
    image: ${PROXY_IMAGE:-caddy:2.10.2-alpine}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    depends_on: [ersatztv]
    environment:
      LEGACY_UPSTREAM: ersatztv:8409
    volumes:
      - ${VIZRS_LIVE_DIR:?ustaw VIZRS_LIVE_DIR w .env}/docker/proxy.Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${ETV_PORT:-8409}:8409"

  live:
    image: ${LIVE_IMAGE:-ghcr.io/sdorpl/vizrs-live:1.0.0}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    depends_on: [ersatztv, cg]
    environment:
      VIZRS_LIVE_BRIDGE: http://ersatztv:8409
      VIZRS_LIVE_BRIDGE_TOKEN: ${VIZRS_BRIDGE_TOKEN}
      VIZRS_LIVE_TOKEN: ${VIZRS_LIVE_TOKEN:?ustaw VIZRS_LIVE_TOKEN w .env}
      VIZRS_LIVE_STREAM_URL: ${VIZRS_LIVE_STREAM_URL:-}
      VIZRS_LIVE_VIZRS_URL: ${VIZRS_LIVE_VIZRS_URL:-}
      VIZRS_LIVE_CG_URL: http://cg:7700
      VIZRS_LIVE_CG_TOKEN: ${VIZRS_PANEL_TOKEN:?ustaw VIZRS_PANEL_TOKEN w .env (token live API CG Playout)}
    ports:
      - "${VIZRS_LIVE_PORT:-8090}:8090"

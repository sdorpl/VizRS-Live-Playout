# VizRS Live wpięty w stos VizRS CG Playout (jeden projekt compose: vizrs, cg, ersatztv, ingest + live, proxy).
# Nakładka na docker-compose.yml CG Playout – uruchamiana z katalogu CG Playout (RUNBOOK §2a):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.nvidia.yml:../VizRS Live/compose.cg-playout.yml
# W .env CG Playout: VIZRS_LIVE_DIR (ścieżka tego repozytorium), VIZRS_BRIDGE_TOKEN, VIZRS_LIVE_TOKEN;
# token CG dla panelu = VIZRS_PANEL_TOKEN CG Playout.
# Panel: LIVE_IMAGE (ghcr albo docker compose build w VizRS Live). Legacy z mostem budowany przy każdym up
# na najnowszym ghcr.io/ersatztv/legacy (tak jak ingest CG Playout).
services:
  ersatztv:
    # oficjalne legacy (zawsze najnowsze) + VizRS Bridge
    build:
      context: ${VIZRS_LIVE_DIR:?ustaw VIZRS_LIVE_DIR w .env}
      dockerfile: docker/legacy-bridge.Dockerfile
      args:
        LEGACY_IMAGE: ${LEGACY_IMAGE:-ghcr.io/ersatztv/legacy:latest}
      pull: true
    pull_policy: build
    image: ${LIVE_LEGACY_IMAGE:-vizrs-live-legacy:local}
    environment:
      VIZRS_BRIDGE_TOKEN: ${VIZRS_BRIDGE_TOKEN:?ustaw VIZRS_BRIDGE_TOKEN w .env}
    # web GUI legacy i most tylko w sieci wewnętrznej; widzowie – przez proxy
    ports: !reset []
    expose: ["8409"]

  proxy:
    image: ${PROXY_IMAGE:-caddy:alpine}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    depends_on: [ersatztv]
    environment:
      LEGACY_UPSTREAM: ersatztv:8409
    volumes:
      - ${VIZRS_LIVE_DIR:?ustaw VIZRS_LIVE_DIR w .env}/docker/proxy.Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${ETV_PORT:-8409}:8409"

  live:
    image: ${LIVE_IMAGE:-ghcr.io/sdorpl/vizrs-live:latest}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    depends_on: [ersatztv, cg]
    # środowisko = usługa live w docker-compose.live.yml CG Playout (pilnuje scripts/check-cg-overlay.sh)
    environment:
      TZ: Europe/Warsaw
      VIZRS_LIVE_BRIDGE: http://ersatztv:8409
      VIZRS_LIVE_BRIDGE_TOKEN: ${VIZRS_BRIDGE_TOKEN}
      VIZRS_LIVE_TOKEN: ${VIZRS_LIVE_TOKEN:?ustaw VIZRS_LIVE_TOKEN w .env}
      VIZRS_LIVE_STREAM_URL: ${VIZRS_LIVE_STREAM_URL:-}
      # VizRS tego stosu widziany z przeglądarki: domyślnie sam port = host, pod którym otwarto panel
      VIZRS_LIVE_VIZRS_URL: ${VIZRS_LIVE_VIZRS_URL:-:${VIZRS_PORT:-8788}}
      # token wyjścia VizRS (tylko odczyt) do podglądu /output; anteny kanałów jak w CG Playout
      VIZRS_LIVE_VIZRS_OUTPUT_TOKEN: ${VIZRS_OUTPUT_TOKEN:-vizrs-output-change-me}
      VIZRS_LIVE_VIZRS_CHANNELS: ${VIZRS_CHANNEL_BUSES:-0}
      VIZRS_LIVE_MULTIVIEW_MAX: ${VIZRS_LIVE_MULTIVIEW_MAX:-4}
      VIZRS_LIVE_CG_URL: http://cg:7700
      VIZRS_LIVE_CG_TOKEN: ${VIZRS_PANEL_TOKEN:?ustaw VIZRS_PANEL_TOKEN w .env (token live API CG Playout)}
    # media tak jak w legacy (ścieżki pozycji 1:1), tylko odczyt – odtwarzanie plików lokalnych w Przeglądarce bez legacy
    volumes:
      - ${MEDIA_DIR:-seed-media}:/media:ro
    ports:
      - "${VIZRS_LIVE_PORT:-8090}:8090"

# VizRS Live: ErsatzTV legacy z mostem + panel.
#   cp .env.example .env   # ustaw tokeny
#   docker compose pull && docker compose up -d     # gotowe obrazy ghcr.io/sdorpl/… (wydanie 1.0)
#   docker compose up -d --build                    # albo budowa na miejscu (np. inna wersja LEGACY_IMAGE)
# Wdrożenie, kopie, aktualizacja, odtworzenie: docs/RUNBOOK.md
# Panel: http://<serwer>:8090/  (token panelu: VIZRS_LIVE_TOKEN)
# Strumienie dla widzów: http://<serwer>:8409/iptv/channels.m3u (przez proxy; web GUI legacy zamknięte – R10)
services:
  ersatztv:
    build:
      context: .
      dockerfile: docker/legacy-bridge.Dockerfile
      args:
        LEGACY_IMAGE: ${LEGACY_IMAGE:-ghcr.io/ersatztv/legacy:v26.12.0}
    image: ${LIVE_LEGACY_IMAGE:-ghcr.io/sdorpl/vizrs-live-legacy:1.0.0-legacy26.12.0}
    restart: unless-stopped
    environment:
      VIZRS_BRIDGE_TOKEN: ${VIZRS_BRIDGE_TOKEN:?ustaw VIZRS_BRIDGE_TOKEN w .env}
      TZ: ${TZ:-Europe/Warsaw}
    # bez portów na zewnątrz: web GUI legacy i most tylko w sieci wewnętrznej Dockera (widzowie – przez proxy)
    expose: ["8409"]
    volumes:
      - ${ETV_CONFIG:-./etv-config}:/config
      - ${MEDIA_DIR:-./media}:/media:ro

  proxy:
    # na zewnątrz tylko /iptv/*, /artwork/* (GET) i HDHomeRun; reszta 403 (docker/proxy.Caddyfile)
    image: ${PROXY_IMAGE:-caddy:2.10.2-alpine}
    restart: unless-stopped
    depends_on: [ersatztv]
    environment:
      LEGACY_UPSTREAM: ersatztv:8409
    volumes:
      - ./docker/proxy.Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8409:8409"            # strumienie, M3U, XMLTV, HDHomeRun dla widzów

  live:
    build:
      context: .
      dockerfile: docker/live.Dockerfile
    image: ${LIVE_IMAGE:-ghcr.io/sdorpl/vizrs-live:1.0.0}
    restart: unless-stopped
    depends_on: [ersatztv]
    environment:
      VIZRS_LIVE_BRIDGE: http://ersatztv:8409
      VIZRS_LIVE_BRIDGE_TOKEN: ${VIZRS_BRIDGE_TOKEN}
      VIZRS_LIVE_TOKEN: ${VIZRS_LIVE_TOKEN:?ustaw VIZRS_LIVE_TOKEN w .env}
      VIZRS_LIVE_STREAM_URL: ${VIZRS_LIVE_STREAM_URL:-}
      VIZRS_LIVE_VIZRS_URL: ${VIZRS_LIVE_VIZRS_URL:-}
      VIZRS_LIVE_CG_URL: ${VIZRS_LIVE_CG_URL:-}
      VIZRS_LIVE_CG_TOKEN: ${VIZRS_LIVE_CG_TOKEN:-}
    ports:
      - "8090:8090"

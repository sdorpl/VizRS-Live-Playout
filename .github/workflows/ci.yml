# CI VizRS Live (R10): serwer (fmt, clippy, testy), oba obrazy, stos testowy z proxy, e2e z Playwright.
# Te same kroki co tests/gate.sh. Niczego nie publikuje (obrazy tylko lokalnie na maszynie CI), binarka panelu jako artefakt.
# Obrazy na ghcr i wydanie: release.yml (znacznik v* albo ręcznie).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serwer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # wspólny rdzeń wyglądu (vizrs-ui.css) = kopia z VizRS CG System w wersji z server/web/CG_SYSTEM
      - name: Wersja CG System dla vizrs-ui.css
        id: cg
        run: echo "ref=$(cat server/web/CG_SYSTEM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: sdorpl/VizRS-CG-System
          ref: ${{ steps.cg.outputs.ref }}
          path: cg
          sparse-checkout: source/web/vizrs-ui.css
          sparse-checkout-cone-mode: false
      - name: vizrs-ui.css zgodny z CG System
        run: scripts/sync-ui.sh --check cg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt / clippy / test / build
        working-directory: server
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked
          ./target/release/vizrs-live --version
          sha256sum target/release/vizrs-live
      - uses: actions/upload-artifact@v4
        with:
          name: vizrs-live-linux-x86_64
          path: server/target/release/vizrs-live
      # release.yml buduje obrazy na amd64 i arm64 – tu kontrola, że oba Dockerfile budują się krzyżowo (bez publikacji)
      - uses: docker/setup-buildx-action@v3
      - name: obrazy arm64 (budowa krzyżowa)
        run: |
          docker buildx build --platform linux/arm64 -f docker/live.Dockerfile .
          docker buildx build --platform linux/arm64 -f docker/legacy-bridge.Dockerfile --build-arg LEGACY_IMAGE="$(sed -n 's#^LEGACY_IMAGE=##p' .env.example)" .

  obrazy-i-e2e:
    needs: serwer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (Chromium)
        run: |
          # katalog poza repo; kontekst runner niedostępny w env joba – przez GITHUB_ENV dla kolejnych kroków
          PLAYWRIGHT_DIR=$RUNNER_TEMP/pw; echo "PLAYWRIGHT_DIR=$PLAYWRIGHT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PLAYWRIGHT_DIR" && cd "$PLAYWRIGHT_DIR"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: obraz panelu
        run: docker build -f docker/live.Dockerfile -t vizrs-live:ci .
      - name: bramka (serwer, obraz legacy z mostem, stos z proxy, seed, e2e)
        run: tests/gate.sh
      - name: akceleracja sprzętowa w obrazie legacy (Intel VAAPI/QSV, AMD VAAPI, NVIDIA NVENC)
        run: tests/hwaccel.sh vizrs-live-legacy:dev
      - name: dziennik przy błędzie
        if: failure()
        run: |
          docker logs vizrs-live-test-legacy 2>&1 | tail -200 || true
          cat "${VIZRS_LIVE_TEST_DIR:-$HOME/.cache/vizrs-live-test}/panel.log" || true
